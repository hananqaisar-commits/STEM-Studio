global
    log stdout format raw local0
    maxconn 50000
    nbthread 4

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    retries 2

frontend stemstudio_http
    bind :80
    http-request set-header X-Real-IP %[src]
    # Overwrite user-supplied forwarding headers at the trusted edge.
    http-request set-header X-Forwarded-For %[src]
    default_backend stemstudio_api

backend stemstudio_api
    balance leastconn
    option httpchk
    http-check send meth GET uri /api/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server api-1 api-1:8000 check
    server api-2 api-2:8000 check
