global
    log stdout format raw local0
    maxconn 50000
    nbthread 4

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    option http-use-htx
    timeout connect 2s
    timeout queue 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    retries 2
    http-reuse safe

frontend stemstudio_http
    bind :80
    http-request set-header X-Real-IP %[src]
    # Overwrite user-supplied forwarding headers at the trusted edge.
    http-request set-header X-Forwarded-For %[src]
    default_backend stemstudio_api

backend stemstudio_api
    balance leastconn
    option http-keep-alive
    option httpchk
    http-check send meth GET uri /api/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 maxconn 2000
    server-template api 1-40 api:8000 check resolvers docker_dns init-addr libc,none

resolvers docker_dns
    nameserver dockerdns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s
