name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint
        continue-on-error: true # Continues even if lint script isn't added yet

      - name: Run Tests
        run: npm test
        continue-on-error: true # Continues even if test script isn't added yet

      - name: Build Application
        run: npm run build
