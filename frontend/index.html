<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ── Favicon set (transparent background Octa mascot) ── -->
    <link rel="icon" type="image/x-icon"         href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml"       href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180"  href="/apple-touch-icon.png" />
    <link rel="manifest"                          href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- 'unsafe-eval' is required by the Paste-code sandbox (codeExecutionEngine.ts),
         which compiles user-pasted algorithm code via the Function constructor. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 https:; img-src 'self' data: blob:; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self';" />
    <title>STEM Studio – Interactive DSA & Algorithm Visualizer</title>
    <meta name="description" content="STEM Studio is an interactive Data Structures and Algorithms learning platform with step-by-step visualizers, multi-language debugger, quizzes, and 138+ topics designed to help students master algorithms." />
    <link rel="canonical" href="https://stem-studio-one.vercel.app/" />
    <meta name="theme-color" content="#6B5CE7" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STEM Studio" />
    <meta property="og:title" content="STEM Studio – Interactive DSA & Algorithm Visualizer" />
    <meta property="og:description" content="STEM Studio is an interactive Data Structures and Algorithms learning platform with step-by-step visualizers, multi-language debugger, quizzes, and 138+ topics designed to help students master algorithms." />
    <meta property="og:url" content="https://stem-studio-one.vercel.app/" />
    <meta property="og:image" content="https://stem-studio-one.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STEM Studio – Interactive DSA & Algorithm Visualizer" />
    <meta name="twitter:description" content="STEM Studio is an interactive Data Structures and Algorithms learning platform with step-by-step visualizers, multi-language debugger, quizzes, and 138+ topics designed to help students master algorithms." />
    <meta name="twitter:image" content="https://stem-studio-one.vercel.app/og-image.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "STEM Studio",
      "url": "https://stem-studio-one.vercel.app/",
      "description": "Interactive Data Structures and Algorithms learning platform with visualizers, debugger, and quizzes.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://stem-studio-one.vercel.app/dashboard?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
